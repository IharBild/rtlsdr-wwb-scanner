[metadata]
name = rtlsdr-wwb-scanner
version = 22.9.0
author = Matthew Reid
author_email = matt@nomadic-recording.com
url = https://github.com/nocarryr/rtlsdr-wwb-scanner
description = RF Scanner and Exporter for use with Shure Wireless Workbench
long_description = file: README.md
long_description_content_type = text/markdown
license = GNU General Public License v2 (GPLv2)
license_files = LICENSE
platforms = any
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: GNU General Public License v2 (GPLv2)
    Topic :: Multimedia :: Sound/Audio
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
zip_safe = False
packages = find:
include_package_data = True
python_requires = >=3.11
# V22.0: Python 3.11+ only (the maintainer's PC runs Python 3.13 since
# 18.11.2026; Python 3.10 reached end of life in October 2026). One stack:
# numpy 1.23+ or 2.x, pyrtlsdr 0.4+ (needs rtlsdr_set_dithering: DLL
# scanner-v7 or newer, drivers/rtlsdr-scanner-v7/install_dll.py) and the
# window on PySide6. tinydb and json-object-factory are no longer used
# (utils/dbstore.py and utils/numpyjson.py read and write the same files).
install_requires =
    numpy>=1.23
    pyrtlsdr>=0.4
    # Only the Qt modules we use: Essentials (QtCore, QtQml, QtQuick,
    # Controls, Dialogs) + Addons (QtCharts); the "PySide6" package would
    # also pull WebEngine and Pdf (several hundred MB).
    # PySide6 6.12.0 on Python 3.11: a Python Qt message handler (the
    # window has one) loses a reference to None on every message and Python
    # aborts ("none_dealloc", checked 18.11.2026; 6.8.3-6.11.1 are fine,
    # Python 3.12+ is not affected).
    PySide6-Essentials>=6.8,<6.12; python_version < "3.12"
    PySide6-Addons>=6.8,<6.12; python_version < "3.12"
    PySide6-Essentials>=6.8; python_version >= "3.12"
    PySide6-Addons>=6.8; python_version >= "3.12"

[options.packages.find]
exclude =
    tests

[options.package_data]
wwb_scanner =
    ui/pyside/qml/*.qml
    ui/pyside/qml/compat/WwbCompat/*
    scanner/*.json
