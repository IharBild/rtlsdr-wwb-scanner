[metadata]
name = rtlsdr-wwb-scanner
version = 21.3.0
author = Matthew Reid
author_email = matt@nomadic-recording.com
url = https://github.com/nocarryr/rtlsdr-wwb-scanner
description = RF Scanner and Exporter for use with Shure Wireless Workbench
long_description = file: README.md
long_description_content_type = text/markdown
license = GNU General Public License v2 (GPLv2)
license_files = LICENSE
platforms = any
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: GNU General Public License v2 (GPLv2)
    Topic :: Multimedia :: Sound/Audio
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
zip_safe = False
packages = find:
include_package_data = True
python_requires = >=3.7
# V21.3: Python 3.7-3.9 keep the stack tested on the maintainer's PC
# (pyrtlsdr 0.3.x works with any of our DLLs). Python 3.10+ gets pyrtlsdr
# 0.4+, which needs rtlsdr_set_dithering: DLL scanner-v7 or newer
# (drivers/rtlsdr-scanner-v7/install_dll.py). PySide2 exists only up to
# Python 3.10; on 3.11+ the window waits for the PySide6 port, the scanner
# core, tests and file export work. PySide2 5.15 is built against numpy 1.x
# and warns "may crash" with numpy 2 (checked on Python 3.10), so numpy
# stays below 2 where PySide2 is installed.
install_requires =
    numpy>=1.13,<2; python_version < "3.11"
    numpy>=1.13; python_version >= "3.11"
    scipy
    pyrtlsdr>=0.2.6,<0.4; python_version < "3.10"
    pyrtlsdr>=0.4; python_version >= "3.10"
    tinydb>=3.13,<5
    json-object-factory
    PySide2>=5.13.1; python_version < "3.11"

[options.packages.find]
exclude =
    tests

[options.package_data]
wwb_scanner =
    ui/pyside/qml/*.qml
    scanner/*.json
