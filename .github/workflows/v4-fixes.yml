name: Tests (v4-fixes, no dongle)

# Automatic tests of the RTL-SDR Blog V4 fork. No dongle is needed: the tests
# use the dongle simulator (tests/sim.py), as in tools/qa_sandbox.py.

on:
  push:
    branches: [ v4-fixes ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ v4-fixes ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # what a new user gets from "pip install" (newest compatible libraries)
          - name: Linux, Python 3.8, current libraries
            os: ubuntu-22.04
            python: '3.8'
            pins: ''
            pytest: 'pytest<8'
            window: true
          # V21.3: the newest Python with PySide2 (window), pyrtlsdr 0.5 and numpy 1.26
          - name: Linux, Python 3.10, current libraries
            os: ubuntu-22.04
            python: '3.10'
            pins: ''
            pytest: 'pytest'
            window: true
          # V21.3: new Python, numpy 2, pyrtlsdr 0.5; no PySide2, so no window yet
          - name: Linux, Python 3.13, current libraries (no window)
            os: ubuntu-22.04
            python: '3.13'
            pins: ''
            pytest: 'pytest'
            window: false
          # the libraries of the maintainer's Windows PC
          - name: Windows, Python 3.8, pinned like the maintainer's PC
            os: windows-2022
            python: '3.8'
            pins: 'numpy==1.21.6 scipy==1.7.3 tinydb==4.8.0 pyrtlsdr==0.3.0 PySide2==5.15.2.1'
            pytest: 'pytest<8'
            window: false
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt libraries for the offscreen window (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install the scanner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.pins }}" ]; then python -m pip install ${{ matrix.pins }}; fi
          python -m pip install . "${{ matrix.pytest }}"
          python -m pip list

      - name: Automatic tests (dongle simulator)
        run: python -m pytest -q tests -p no:cacheprovider

      - name: Program window with the simulator (U1-U22)
        if: matrix.window
        run: python tools/qa_ui.py
