name: Tests (v4-fixes, no dongle)

# Automatic tests of the RTL-SDR Blog V4 fork. No dongle is needed: the tests
# use the dongle simulator (tests/sim.py), as in tools/qa_sandbox.py.

on:
  push:
    branches: [ v4-fixes ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ v4-fixes ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # V22.0: Python 3.11+ only, the window on PySide6 everywhere.
          # the oldest supported Python
          - name: Linux, Python 3.11 (PySide6)
            os: ubuntu-22.04
            python: '3.11'
            pins: ''
            pytest: 'pytest'
            window: true
          # the stack of the maintainer's PC since 18.11.2026 (wwb-py313)
          - name: Linux, Python 3.13 (PySide6)
            os: ubuntu-22.04
            python: '3.13'
            pins: ''
            pytest: 'pytest'
            window: true
          - name: Windows, Python 3.13 like the maintainer's PC (PySide6)
            os: windows-2022
            python: '3.13'
            pins: 'PySide6-Essentials==6.12.0 PySide6-Addons==6.12.0'
            pytest: 'pytest'
            window: true
          # the newest Python: what a new user may have
          - name: Linux, Python 3.14 (PySide6)
            os: ubuntu-22.04
            python: '3.14'
            pins: ''
            pytest: 'pytest'
            window: true
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt libraries for the offscreen window (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 libopengl0

      - name: Install the scanner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.pins }}" ]; then python -m pip install ${{ matrix.pins }}; fi
          python -m pip install . "${{ matrix.pytest }}"
          python -m pip list

      - name: Automatic tests (dongle simulator)
        run: python -m pytest -q tests -p no:cacheprovider

      - name: Program window with the simulator (U1-U41)
        if: matrix.window
        run: python tools/qa_ui.py
